[project]
name = "inkgrader-core"
version = "0.1.0"
description = "Shared InkGrader business logic: Database, Grading, Agents, FileProcessor"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.18.4",
    "chonkie>=1.5.6",
    "groq>=1.0.0",
    "huggingface-hub>=1.5.0",
    "pgvector>=0.4.2",
    "psycopg[binary]>=3.3.3",
    "pypdf==6.0.0",
    "python-dotenv==1.1.1",
    "redis==6.4.0",
    "requests>=2.32.5",
    "scikit-learn>=1.8.0",
    "sqlalchemy>=2.0.47",
]

[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["Database", "Grading", "Agents", "FileProcessor"]
