services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: inkgrader
      POSTGRES_PASSWORD: inkgrader
      POSTGRES_DB: inkgrader
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inkgrader"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    env_file: ./backend/.env.dev
    environment:
      REDIS_URL: redis://redis:6379
      POSTGRES_URL: postgresql+psycopg://inkgrader:inkgrader@postgres:5432/inkgrader
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_started
      postgres:
        condition: service_healthy

  gateway:
    build: ./backend
    command: ["uv", "run", "fastapi", "run", "gateway.py", "--host", "0.0.0.0", "--port", "8001"]
    env_file: ./backend/.env.dev
    environment:
      REDIS_URL: redis://redis:6379
    ports:
      - "8001:8001"
    depends_on:
      - redis

  frontend:
    build: ./frontend
    env_file: ./frontend/.env.dev
    environment:
      BACKEND_URL: http://backend:8000/
      NEXT_PUBLIC_GATEWAY_WS_URL: ws://localhost:8001
      DATABASE_URL: postgresql://inkgrader:inkgrader@postgres:5432/inkgrader
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_started
      gateway:
        condition: service_started
      postgres:
        condition: service_healthy
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next

volumes:
  redis-data:
  postgres-data:
