services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: inkgrader
      POSTGRES_PASSWORD: inkgrader
      POSTGRES_DB: inkgrader
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inkgrader"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: api/Dockerfile
    env_file: ./backend/.env.dev
    environment:
      POSTGRES_URL: postgresql+psycopg://inkgrader:inkgrader@postgres:5432/inkgrader
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  grading-worker:
    build:
      context: ./backend
      dockerfile: worker/Dockerfile
    env_file: ./backend/.env.dev
    environment:
      POSTGRES_URL: postgresql+psycopg://inkgrader:inkgrader@postgres:5432/inkgrader
    depends_on:
      backend:
        condition: service_started
      postgres:
        condition: service_healthy
    deploy:
      replicas: 3

  frontend:
    build: ./frontend
    env_file: ./frontend/.env.dev
    environment:
      BACKEND_URL: http://backend:8000/
      DATABASE_URL: postgresql://inkgrader:inkgrader@postgres:5432/inkgrader
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_started
      postgres:
        condition: service_healthy
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next

volumes:
  postgres-data:
